allprojects {
    repositories {
        maven { url "https://jitpack.io" }
    }
}

dependencies {
    def VERSION_ANDROID_SUPPORT = '28.0.0'

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "com.android.support:appcompat-v7:$VERSION_ANDROID_SUPPORT"
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    implementation "com.android.support:support-v4:$VERSION_ANDROID_SUPPORT"
    implementation 'com.android.support:support-v4:28.0.0'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'com.android.support.test:runner:1.0.2'
    androidTestImplementation 'com.android.support.test.espresso:espresso-core:3.0.2'
    //my own
    implementation "com.android.support:design:$VERSION_ANDROID_SUPPORT"
    implementation "com.android.support:recyclerview-v7:$VERSION_ANDROID_SUPPORT"
    implementation 'com.github.chrisbanes:PhotoView:2.0.0'
    implementation 'android.arch.lifecycle:extensions:1.1.1'
    implementation "com.android.support:gridlayout-v7:$VERSION_ANDROID_SUPPORT"
    implementation "com.android.support:appcompat-v7:$VERSION_ANDROID_SUPPORT"
}
