    signingConfigs {
        debug {
            storeFile file('C:\\Users\\frank\\OneDrive\\Android\\Keystores\\android.jks')
            storePassword 'Antoschka@Wi)%42'
            keyAlias = 'key0'
            keyPassword 'Antoschka@Wi)%42'
        }
    }
    compileSdkVersion 28
    defaultConfig {
        applicationId "de.sharknoon.placepixelhobby"
        minSdkVersion 24
        targetSdkVersion 28
        versionCode 4
        versionName '1.3'
        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            // Enables code shrinking, obfuscation, and optimization for only
